name: tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # `uv run` syncs the environment from uv.lock first, which would
    # reinstall the locked django over the one the matrix leg installed.
    env:
      UV_NO_SYNC: '1'
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
        django-version: ['4.2', '5.1', '5.2', '6.0', '6.1']
        exclude:
          # django 6.x requires python 3.12+
          - python-version: '3.10'
            django-version: '6.0'
          - python-version: '3.10'
            django-version: '6.1'
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install django @ ${{ matrix.django-version }}
        run: uv pip install DJANGO~=${{ matrix.django-version }}.0

      - name: Print python versions
        run: |
          python -V
          uv run python -V

      - name: Lint with ruff check
        run: uv run ruff check .

      - name: Format with ruff format
        run: uv run ruff format . --check

      - name: Lint with mypy
        run: uv run mypy .

      - name: Test with pytest
        run: uv run py.test --cov=./ --cov-report=xml

      # Installs only [project].dependencies, so anything imported at runtime
      # but declared in a dependency group fails here rather than on PyPI.
      - name: Runtime dependency smoke test
        run: >
          uvx --isolated --no-cache
          --python ${{ matrix.python-version }}
          --from . python scripts/runtime_dep_smoketest.py

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      id-token: write
      attestations: write

    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Build package
        run: uv build


      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true
